name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Siapkan ikon DLMS L-Tronik
        run: |
          test -f dlms-ltronik.png
          mkdir -p android/app/src/main/res/drawable
          cp dlms-ltronik.png android/app/src/main/res/drawable/dlms_ltronik.png
      - run: npm run apk
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ltronik-dsp.apk
      - uses: actions/upload-artifact@v4
        with: { name: ltronik-dsp-apk, path: ltronik-dsp.apk }
      - name: Rilis (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: ltronik-dsp.apk }
