name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm install
          # Plugin BLE untuk fitur update firmware (hapus baris ini jika sudah ada di package.json)
          npm install @capacitor-community/bluetooth-le

      - name: Build web
        run: npm run build

      - name: Setup Android
        run: npx cap add android

      - name: Izin Bluetooth di AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
          """

          if "BLUETOOTH_CONNECT" not in s:
              s = s.replace("</manifest>", perms + "</manifest>")
              p.write_text(s)
              print("Izin Bluetooth ditambahkan.")
          else:
              print("Izin Bluetooth sudah ada.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Pasang ikon DLMS L-Tronik
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Path("dlms-ltronik.png")

          if not src.exists():
              raise SystemExit("ERROR: File dlms-ltronik.png tidak ditemukan")

          img = Image.open(src).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  img,
                  (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          # Hapus ikon adaptif bawaan agar ikon PNG baru digunakan.
          for folder in [
              res / "mipmap-anydpi-v26",
              res / "mipmap-anydpi",
          ]:
              for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  path = folder / name
                  if path.exists():
                      path.unlink()

          print("Ikon DLMS L-Tronik berhasil dipasang.")
          PY

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DLMS-L-Tronik.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DLMS-L-Tronik-APK
          path: DLMS-L-Tronik.apk
          if-no-files-found: error

      - name: Attach APK to release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DLMS-L-Tronik.apk
