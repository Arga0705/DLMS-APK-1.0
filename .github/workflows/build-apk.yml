name: Build APK

# Syarat di repo:
#   - package.json (Vite + Capacitor 7 + @capacitor-community/bluetooth-le), webDir = dist
#   - src/bleOta.js          (modul update firmware, dari saya)
#   - dlms-ltronik.png       (opsional: ikon aplikasi)
# Update firmware ada di menu System (index.html) dan memakai src/native.js -> src/bleOta.js.
# Tidak ada lagi tombol melayang yang disisipkan saat build.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BLEOTA_PATH: src/bleOta.js

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cek file bleOta
        run: |
          test -f "$BLEOTA_PATH" || { echo "ERROR: $BLEOTA_PATH tidak ditemukan. Salin bleOta.js ke folder src/"; exit 1; }

      - name: Install dependencies
        run: |
          npm install
          # Plugin BLE (@capacitor-community/bluetooth-le) sudah ada di package.json

      - name: Build web
        run: npm run build

      - name: Cari folder web (webDir)
        run: |
          python3 - <<'PY'
          import os, re, glob

          web = None
          for cfg in glob.glob("capacitor.config.*"):
              m = re.search(r"webDir\s*[:=]\s*['\"]([^'\"]+)['\"]", open(cfg, encoding="utf-8").read())
              if m:
                  web = m.group(1)
                  break
          if not web or not os.path.isfile(os.path.join(web, "index.html")):
              for d in ["dist", "build", "www", "public"]:
                  if os.path.isfile(os.path.join(d, "index.html")):
                      web = d
                      break
          if not web:
              raise SystemExit("ERROR: folder web dengan index.html tidak ditemukan setelah build")
          print("webDir =", web)
          open(os.environ["GITHUB_ENV"], "a").write("WEBDIR=%s\n" % web)
          PY

      - name: Setup Android
        run: |
          if [ -d android ]; then
            echo "Folder android sudah ada, dipakai apa adanya"
          else
            npx cap add android
          fi

      - name: Izin Bluetooth di AndroidManifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          perms = """
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
          """

          if "BLUETOOTH_CONNECT" not in s:
              p.write_text(s.replace("</manifest>", perms + "</manifest>"))
              print("Izin Bluetooth ditambahkan.")
          else:
              print("Izin Bluetooth sudah ada.")
          PY

      - name: Sync Android
        run: npx cap sync android

      - name: Pasang ikon
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Path("dlms-ltronik.png")
          if not src.exists():
              print("dlms-ltronik.png tidak ada, memakai ikon bawaan.")
              raise SystemExit(0)

          img = Image.open(src).convert("RGBA")
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96,
                   "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          res = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = ImageOps.fit(img, (size, size), method=Image.Resampling.LANCZOS)
              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          # Hapus ikon adaptif bawaan agar ikon PNG baru digunakan.
          for folder in [res / "mipmap-anydpi-v26", res / "mipmap-anydpi"]:
              for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  path = folder / name
                  if path.exists():
                      path.unlink()
          print("Ikon berhasil dipasang.")
          PY

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LTRONIK-DSP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LTRONIK-DSP-APK
          path: LTRONIK-DSP.apk
          if-no-files-found: error

      - name: Attach APK to release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LTRONIK-DSP.apk
