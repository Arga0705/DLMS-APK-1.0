name: Build APK

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Setup Android
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Pasang ikon DLMS L-Tronik
        run: |
          python3 -m pip install Pillow

          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path

          src = Path("dlms-ltronik.png")

          if not src.exists():
              raise SystemExit("ERROR: File dlms-ltronik.png tidak ditemukan")

          img = Image.open(src).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          res = Path("android/app/src/main/res")

          for folder, size in sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)

              icon = ImageOps.fit(
                  img,
                  (size, size),
                  method=Image.Resampling.LANCZOS
              )

              icon.save(target / "ic_launcher.png")
              icon.save(target / "ic_launcher_round.png")

          # Hapus ikon adaptif bawaan agar ikon PNG baru digunakan.
          for folder in [
              res / "mipmap-anydpi-v26",
              res / "mipmap-anydpi",
          ]:
              for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
                  path = folder / name
                  if path.exists():
                      path.unlink()

          print("Ikon DLMS L-Tronik berhasil dipasang.")
          PY
